<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade: Flappy Pigeon & Dino Jump</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      user-select: none;
    }
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .tab-btn {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid #4a4e69;
      background: #22223b;
      color: #c9ada7;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s ease;
    }
    .tab-btn.active, .tab-btn:hover {
      background: #4a4e69;
      color: #fff;
      border-color: #9a8c98;
    }
    .game-container {
      position: relative;
      background: #000;
      border: 4px solid #4a4e69;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas { display: block; cursor: pointer; }
    .instructions {
      margin-top: 14px;
      font-size: 14px;
      color: #9a8c98;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchGame('pigeon')">🐦 Flappy Pigeon</button>
    <button class="tab-btn" onclick="switchGame('dino')">🦖 Dino Jump</button>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="480" height="480"></canvas>
  </div>

  <div class="instructions">
    Press <b>SPACEBAR</b> or <b>CLICK / TAP</b> to Flap / Jump!
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentGame = 'pigeon';
    let animationId = null;
    let score = 0;
    let highScorePigeon = 0;
    let highScoreDino = 0;
    let gameOver = false;

    // --- INPUT HANDLING ---
    function handleInput() {
      if (gameOver) {
        initGame();
        return;
      }
      if (currentGame === 'pigeon') {
        pigeon.vy = -7.5;
        pigeon.wingUp = true;
        setTimeout(() => pigeon.wingUp = false, 150);
      } else if (currentGame === 'dino') {
        if (dino.y >= dino.groundY) {
          dino.vy = -12;
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        handleInput();
      }
    });
    canvas.addEventListener('mousedown', handleInput);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleInput();
    });

    function switchGame(game) {
      currentGame = game;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      initGame();
    }

    function initGame() {
      if (animationId) cancelAnimationFrame(animationId);
      gameOver = false;
      score = 0;

      if (currentGame === 'pigeon') {
        initPigeonGame();
      } else {
        initDinoGame();
      }
      gameLoop();
    }

    // ==========================================
    // GAME 1: FLAPPY PIGEON
    // ==========================================
    let pigeon, pipes, frameCount;

    function initPigeonGame() {
      pigeon = { x: 80, y: 200, vy: 0, radius: 16, wingUp: false };
      pipes = [];
      frameCount = 0;
    }

    function updatePigeon() {
      pigeon.vy += 0.42; // Gravity
      pigeon.y += pigeon.vy;

      // Pipe Spawning
      frameCount++;
      if (frameCount % 90 === 0) {
        const gapHeight = 130;
        const minTop = 50;
        const maxTop = canvas.height - gapHeight - 100;
        const top = Math.floor(Math.random() * (maxTop - minTop + 1)) + minTop;
        pipes.push({ x: canvas.width, top: top, bottom: canvas.height - top - gapHeight, passed: false });
      }

      // Check collision with floor/ceiling
      if (pigeon.y + pigeon.radius >= canvas.height - 30 || pigeon.y - pigeon.radius <= 0) {
        gameOver = true;
      }

      // Pipe updates & collision
      for (let i = pipes.length - 1; i >= 0; i--) {
        let p = pipes[i];
        p.x -= 2.5;

        // Collision Check
        const pipeWidth = 55;
        if (
          pigeon.x + pigeon.radius > p.x &&
          pigeon.x - pigeon.radius < p.x + pipeWidth
        ) {
          if (pigeon.y - pigeon.radius < p.top || pigeon.y + pigeon.radius > canvas.height - p.bottom) {
            gameOver = true;
          }
        }

        // Score
        if (!p.passed && p.x + pipeWidth < pigeon.x) {
          p.passed = true;
          score++;
          if (score > highScorePigeon) highScorePigeon = score;
        }

        // Remove off-screen pipes
        if (p.x < -pipeWidth) pipes.splice(i, 1);
      }
    }

    function drawPigeonGame() {
      // Sky
      ctx.fillStyle = '#70c5ce';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // City Background Hills
      ctx.fillStyle = '#bce6eb';
      ctx.beginPath();
      ctx.arc(100, 480, 200, Math.PI, 0);
      ctx.arc(350, 480, 180, Math.PI, 0);
      ctx.fill();

      // Ground
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 8);

      // Pipes (Classic Green Pipes with Caps)
      pipes.forEach(p => {
        const pipeWidth = 55;
        const capHeight = 22;

        ctx.fillStyle = '#73bf2e';
        ctx.strokeStyle = '#2d5a06';
        ctx.lineWidth = 3;

        // Top Pipe Body & Cap
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.strokeRect(p.x, 0, pipeWidth, p.top);
        ctx.fillRect(p.x - 4, p.top - capHeight, pipeWidth + 8, capHeight);
        ctx.strokeRect(p.x - 4, p.top - capHeight, pipeWidth + 8, capHeight);

        // Bottom Pipe Body & Cap
        const bottomY = canvas.height - p.bottom;
        ctx.fillRect(p.x, bottomY, pipeWidth, p.bottom - 30);
        ctx.strokeRect(p.x, bottomY, pipeWidth, p.bottom - 30);
        ctx.fillRect(p.x - 4, bottomY, pipeWidth + 8, capHeight);
        ctx.strokeRect(p.x - 4, bottomY, pipeWidth + 8, capHeight);
      });

      // Draw Pigeon
      ctx.save();
      ctx.translate(pigeon.x, pigeon.y);
      let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, pigeon.vy * 0.08));
      ctx.rotate(angle);

      // Pigeon Body (Light Grey)
      ctx.fillStyle = '#a0a5ab';
      ctx.beginPath();
      ctx.ellipse(0, 0, 18, 13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#52575d';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Pigeon Neck / Head (Purple-Green Sheen)
      ctx.fillStyle = '#6b5280';
      ctx.beginPath();
      ctx.arc(10, -5, 10, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(14, -7, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(15, -7, 1.5, 0, Math.PI * 2);
      ctx.fill();

      // Beak (Small orange)
      ctx.fillStyle = '#fca311';
      ctx.beginPath();
      ctx.moveTo(18, -4);
      ctx.lineTo(24, -2);
      ctx.lineTo(18, 1);
      ctx.closePath();
      ctx.fill();

      // Wing
      ctx.fillStyle = '#7a808a';
      ctx.beginPath();
      if (pigeon.wingUp) {
        ctx.ellipse(-3, -10, 10, 6, -Math.PI / 4, 0, Math.PI * 2);
      } else {
        ctx.ellipse(-3, 3, 10, 6, Math.PI / 6, 0, Math.PI * 2);
      }
      ctx.fill();

      ctx.restore();

      // Score Display
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.font = 'bold 32px sans-serif';
      ctx.strokeText(`Score: ${score}`, 20, 45);
      ctx.fillText(`Score: ${score}`, 20, 45);

      ctx.font = 'bold 16px sans-serif';
      ctx.strokeText(`Best: ${highScorePigeon}`, 20, 75);
      ctx.fillText(`Best: ${highScorePigeon}`, 20, 75);
    }

    // ==========================================
    // GAME 2: DINOSAUR JUMP OVER CACTI
    // ==========================================
    let dino, cacti, dinoFrame;

    function initDinoGame() {
      dino = { x: 60, y: 380, groundY: 380, vy: 0, width: 44, height: 48 };
      cacti = [];
      dinoFrame = 0;
    }

    function updateDino() {
      dino.vy += 0.65; // Gravity
      dino.y += dino.vy;

      if (dino.y > dino.groundY) {
        dino.y = dino.groundY;
        dino.vy = 0;
      }

      dinoFrame++;

      // Cactus Spawning
      if (dinoFrame % 100 === 0) {
        cacti.push({ x: canvas.width, width: 22 + Math.random() * 15, height: 38 + Math.random() * 18 });
      }

      // Update Cacti
      for (let i = cacti.length - 1; i >= 0; i--) {
        let c = cacti[i];
        c.x -= 5;

        // Collision Check
        if (
          dino.x < c.x + c.width - 6 &&
          dino.x + dino.width - 6 > c.x &&
          dino.y + dino.height > canvas.height - 52 - c.height
        ) {
          gameOver = true;
        }

        // Score
        if (c.x < -c.width) {
          cacti.splice(i, 1);
          score++;
          if (score > highScoreDino) highScoreDino = score;
        }
      }
    }

    function drawDinoGame() {
      // Desert Sky
      ctx.fillStyle = '#f7f7f7';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ground Line
      ctx.strokeStyle = '#535353';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 50);
      ctx.lineTo(canvas.width, canvas.height - 50);
      ctx.stroke();

      // Ground bumps
      ctx.fillStyle = '#888';
      for (let i = 0; i < canvas.width; i += 60) {
        let xPos = (i - (dinoFrame * 5) % 60);
        ctx.fillRect(xPos, canvas.height - 45, 8, 2);
      }

      // Cacti (Green Cactuses)
      cacti.forEach(c => {
        let cY = canvas.height - 50 - c.height;

        ctx.fillStyle = '#2b9348';
        ctx.strokeStyle = '#004b23';
        ctx.lineWidth = 2;

        // Main Trunk
        ctx.fillRect(c.x, cY, c.width, c.height);
        ctx.strokeRect(c.x, cY, c.width, c.height);

        // Cactus Side Arms
        let armY = cY + c.height * 0.3;
        ctx.fillRect(c.x - 6, armY, 6, 12);
        ctx.fillRect(c.x - 6, armY - 4, 10, 6);

        ctx.fillRect(c.x + c.width, armY + 6, 6, 12);
        ctx.fillRect(c.x + c.width - 4, armY + 12, 10, 6);
      });

      // Dinosaur (Grey Pixelated T-Rex)
      ctx.fillStyle = '#535353';
      let dX = dino.x;
      let dY = dino.y;

      // Head
      ctx.fillRect(dX + 16, dY, 24, 16);
      // Eye
      ctx.fillStyle = '#fff';
      ctx.fillRect(dX + 30, dY + 3, 4, 4);
      ctx.fillStyle = '#535353';

      // Body & Tail
      ctx.fillRect(dX + 8, dY + 12, 24, 22);
      ctx.fillRect(dX, dY + 16, 12, 10); // Tail
      ctx.fillRect(dX - 4, dY + 14, 6, 6); // Tail tip

      // Tiny Arm
      ctx.fillRect(dX + 28, dY + 20, 8, 4);

      // Running Legs Animation
      let legAnim = Math.floor(dinoFrame / 6) % 2;
      if (dino.y < dino.groundY) { // Jump pose
        ctx.fillRect(dX + 10, dY + 34, 6, 8);
        ctx.fillRect(dX + 22, dY + 34, 6, 6);
      } else { // Running pose
        if (legAnim === 0) {
          ctx.fillRect(dX + 8, dY + 34, 6, 10);
          ctx.fillRect(dX + 22, dY + 34, 6, 6);
        } else {
          ctx.fillRect(dX + 8, dY + 34, 6, 6);
          ctx.fillRect(dX + 22, dY + 34, 6, 10);
        }
      }

      // Score Display
      ctx.fillStyle = '#535353';
      ctx.font = 'bold 24px monospace';
      ctx.fillText(`HI: ${String(highScoreDino).padStart(5, '0')}  ${String(score).padStart(5, '0')}`, 230, 40);
    }

    // ==========================================
    // MAIN GAME LOOP
    // ==========================================
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (currentGame === 'pigeon') {
        if (!gameOver) updatePigeon();
        drawPigeonGame();
      } else {
        if (!gameOver) updateDino();
        drawDinoGame();
      }

      if (gameOver) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = 'bold 36px sans-serif';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

        ctx.font = '18px sans-serif';
        ctx.fillText('Press SPACE or TAP to Restart', canvas.width / 2, canvas.height / 2 + 30);
        ctx.textAlign = 'start';
      } else {
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    // Start on load
    initGame();
  </script>
</body>
</html>
